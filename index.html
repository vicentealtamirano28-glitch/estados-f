<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pinda Export — Plan de internacionalización a Sudamérica</title>
<meta name="description" content="Caso de exportación de Pinda Kombucha (Valdivia, Chile) a seis mercados sudamericanos. Trabajo académico de Marketing Internacional, Universidad Austral de Chile.">
<style>
/* ==========================================================================
   Pinda Export — hoja de estilos única, sin dependencias.
   Paleta derivada de los dos anclajes de marca: el bosque templado lluvioso
   valdiviano (verdes profundos) y el colibrí que la marca usa como símbolo
   (iridiscencia turquesa). Todo en OKLCH para que las variaciones de
   luminosidad sean perceptualmente uniformes entre modo claro y oscuro.
   ========================================================================== */

:root {
  --background: oklch(0.988 0.006 100);
  --foreground: oklch(0.23 0.028 158);
  --canvas: oklch(0.967 0.014 128);
  --card: oklch(1 0 0);
  --primary: oklch(0.42 0.088 157);
  --primary-fg: oklch(0.985 0.008 120);
  --secondary: oklch(0.955 0.016 130);
  --muted-fg: oklch(0.49 0.022 155);
  --accent: oklch(0.63 0.112 192);
  --accent-fg: oklch(0.99 0.006 190);
  --destructive: oklch(0.55 0.2 27);
  --border: oklch(0.915 0.014 140);
  --radius: 0.75rem;
  --shadow-sm: 0 1px 2px oklch(0.23 0.028 158 / 0.06);
  --shadow-md: 0 4px 16px oklch(0.23 0.028 158 / 0.08);
  --maxw: 72rem;
  /* Fondo de la cabecera al desplazarse. Alfa explícito en lugar de
     color-mix con `transparent`, cuyo resultado varía entre navegadores. */
  --header-bg: oklch(0.988 0.006 100 / 0.94);
}

html.dark {
  --background: oklch(0.175 0.022 162);
  --foreground: oklch(0.955 0.012 120);
  --canvas: oklch(0.205 0.026 160);
  --card: oklch(0.225 0.028 160);
  --primary: oklch(0.74 0.128 158);
  --primary-fg: oklch(0.19 0.03 160);
  --secondary: oklch(0.285 0.03 158);
  --muted-fg: oklch(0.72 0.022 140);
  --accent: oklch(0.73 0.118 192);
  --accent-fg: oklch(0.18 0.03 190);
  --destructive: oklch(0.68 0.18 25);
  --border: oklch(1 0 0 / 0.12);
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.3);
  --shadow-md: 0 4px 16px oklch(0 0 0 / 0.35);
  --header-bg: oklch(0.175 0.022 162 / 0.94);
}

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  /* Compensa la cabecera fija al navegar por anclas. */
  scroll-padding-top: 5rem;
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.2; letter-spacing: -0.015em; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

a { color: inherit; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

/* Tamaño base de todo SVG, en el propio elemento.
   Antes el tamaño venía sólo de selectores de contexto (`.btn svg`,
   `.card > svg`…), y bastaba usar un icono en un contexto sin regla para que
   quedara sin dimensiones y se expandiera a toda la tarjeta. Esto lo impide.
   Va aquí, antes de las reglas de contexto, para que aquéllas lo sobrescriban
   cuando necesiten otro tamaño: a igual especificidad gana la última. */
svg.ico {
  width: 1rem; height: 1rem; flex-shrink: 0;
}
svg.brand-mark {
  width: 1.75rem; height: 1.75rem; flex-shrink: 0;
}

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Enlace de salto al contenido: primer tabulador de la página. */
.skip {
  position: absolute; left: -9999px; z-index: 100;
  background: var(--primary); color: var(--primary-fg);
  padding: 0.6rem 1rem; border-radius: 0.5rem;
  font-size: 0.875rem; font-weight: 500; text-decoration: none;
}
.skip:focus { left: 0.75rem; top: 0.75rem; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 1.25rem; }

/* ---------- Titulares con degradado de marca ---------- */
.grad {
  background-image: linear-gradient(135deg, var(--primary), var(--foreground));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  padding-bottom: 0.1em;
}

/* ---------- Cabecera ---------- */
header.site {
  position: sticky; top: 0; z-index: 50;
  border-bottom: 1px solid transparent;
  transition: background-color 0.3s, border-color 0.3s;
}
header.site.scrolled {
  background: var(--header-bg);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  border-bottom-color: var(--border);
}
.hdr-inner {
  max-width: var(--maxw); margin: 0 auto; padding: 0 1.25rem;
  height: 4rem; display: flex; align-items: center; gap: 1rem;
}
.logo {
  display: flex; align-items: center; gap: 0.5rem;
  text-decoration: none; flex-shrink: 0; border-radius: 0.25rem;
}
.logo svg { width: 1.75rem; height: 1.75rem; color: var(--primary); }
.logo-txt { font-size: 0.875rem; font-weight: 600; line-height: 1.15; }
.logo-sub {
  display: block; font-size: 0.625rem; font-weight: 400; color: var(--muted-fg);
}

nav.main { display: none; flex: 1; justify-content: center; }
nav.main ul { display: flex; align-items: center; gap: 0.15rem; }
nav.main a {
  display: block; padding: 0.4rem 0.6rem; border-radius: 0.375rem;
  font-size: 0.8125rem; font-weight: 500; color: var(--muted-fg);
  text-decoration: none; transition: color 0.2s, background-color 0.2s;
  white-space: nowrap;
}
nav.main a:hover { color: var(--foreground); background: var(--secondary); }
@media (min-width: 1060px) { nav.main { display: flex; } }

.hdr-actions { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }

.seg {
  display: flex; align-items: center; gap: 0.125rem;
  border: 1px solid var(--border); background: var(--card);
  border-radius: 0.5rem; padding: 0.125rem;
}
.seg button {
  border: 0; background: none; border-radius: 0.375rem;
  padding: 0.25rem 0.5rem; font-size: 0.6875rem; font-weight: 600;
  text-transform: uppercase; color: var(--muted-fg);
  transition: background-color 0.2s, color 0.2s;
}
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-fg); }

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.25rem; height: 2.25rem; flex-shrink: 0;
  border: 1px solid var(--border); background: var(--card);
  border-radius: 0.5rem; transition: background-color 0.2s;
}
.icon-btn:hover { background: var(--secondary); }
.icon-btn svg { width: 1rem; height: 1rem; }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; padding: 4rem 0 6rem; }
.hero-bg { position: absolute; inset: 0; pointer-events: none; }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); }
.blob-1 {
  top: -8rem; left: -6rem; width: 34rem; height: 34rem; opacity: 0.22;
  background: radial-gradient(circle, oklch(0.72 0.15 158) 0%, transparent 70%);
}
.blob-2 {
  top: 5rem; right: -8rem; width: 28rem; height: 28rem; opacity: 0.18;
  background: radial-gradient(circle, oklch(0.7 0.13 196) 0%, transparent 70%);
}
.blob-3 {
  top: 11rem; left: 33%; width: 10rem; height: 10rem; opacity: 0.25;
  background: radial-gradient(circle, oklch(0.85 0.1 140) 0%, transparent 70%);
  animation: drift 22s ease-in-out infinite;
}
html.dark .blob-1 { opacity: 0.16; }
html.dark .blob-2 { opacity: 0.14; }
@keyframes drift {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(40px, -24px); }
  66% { transform: translate(-10px, 12px); }
}
.hero-fade {
  position: absolute; inset-inline: 0; bottom: 0; height: 8rem;
  background: linear-gradient(to top, var(--background), transparent);
}
.hero-inner { position: relative; }

.eyebrow {
  display: flex; align-items: center; gap: 0.5rem;
  color: var(--accent); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; margin: 0;
}
.eyebrow svg { width: 0.875rem; height: 0.875rem; flex-shrink: 0; }

h1.hero-title {
  margin-top: 1.25rem; max-width: 56rem;
  font-size: clamp(2.25rem, 6vw, 4.2rem); font-weight: 900;
  line-height: 1.05; text-wrap: balance;
}
.hero-lead {
  margin-top: 2rem; max-width: 42rem; color: var(--muted-fg);
  font-size: 1rem; text-wrap: pretty;
}
.hero-cta { margin-top: 2.5rem; display: flex; flex-wrap: wrap; gap: 0.75rem; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  border-radius: 0.5rem; border: 1px solid transparent;
  font-size: 0.9375rem; font-weight: 500; text-decoration: none;
  height: 3rem; padding: 0 1.75rem;
  transition: background-color 0.2s, border-color 0.2s, transform 0.1s;
}
.btn:active { transform: translateY(1px); }
.btn svg { width: 1rem; height: 1rem; }
.btn-primary { background: var(--primary); color: var(--primary-fg); box-shadow: var(--shadow-sm); }
.btn-primary:hover { background: color-mix(in oklch, var(--primary) 90%, transparent); }
.btn-outline { background: var(--card); color: var(--foreground); border-color: var(--border); }
.btn-outline:hover { background: var(--secondary); border-color: color-mix(in oklch, var(--primary) 30%, transparent); }
.btn-sm { height: 2.5rem; padding: 0 1.25rem; font-size: 0.875rem; }

.proof {
  margin-top: 3.5rem; padding-top: 2rem; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; gap: 0.75rem 2rem;
}
.proof-item { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; }
.proof-item > svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; color: var(--accent); }
.proof-item .pi-logo { color: var(--primary); }

.hero-note { margin-top: 2rem; color: var(--muted-fg); font-size: 0.75rem; }

/* ---------- Secciones ---------- */
section.sec { padding: 5rem 0; scroll-margin-top: 5rem; }
section.sec.tinted { background: var(--canvas); }
.sec-head { max-width: 48rem; }
.sec-eyebrow {
  color: var(--accent); font-size: 0.6875rem; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 0.75rem;
}
h2.sec-title { font-size: clamp(1.75rem, 3.5vw, 2.25rem); font-weight: 700; }
.sec-sub { margin-top: 1rem; color: var(--muted-fg); font-size: 0.9375rem; }
.sec-body { margin-top: 3rem; }

/* ---------- Rejillas y tarjetas ---------- */
.grid { display: grid; gap: 1.25rem; }
@media (min-width: 768px) { .g-md-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 880px) { .g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 880px) { .g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .g-lg-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow-sm);
  height: 100%;
}
.card.flat { background: var(--canvas); box-shadow: none; padding: 1.25rem; }
section.tinted .card.flat { background: var(--background); }
.card h3 { font-size: 0.9375rem; font-weight: 600; }
.card .body { margin-top: 0.625rem; color: var(--muted-fg); font-size: 0.8125rem; }
/* El tamaño va en la propia clase, no en un selector de hijo directo: el
   icono también se usa dentro de un <h3> y un `.card > svg` no lo alcanzaba,
   dejándolo sin dimensiones y expandido a toda la tarjeta. */
svg.lead-icon {
  width: 1.25rem; height: 1.25rem; flex-shrink: 0;
  color: var(--accent); display: block;
}
.card > svg.lead-icon { margin-bottom: 0.75rem; }
/* Cuando acompaña a un titular, va en línea con el texto. */
.card h3 > svg.lead-icon { display: inline-block; vertical-align: -0.15em; margin-right: 0.4rem; }

/* Haz de luz en el borde. Reimplementación propia del efecto: un
   conic-gradient que gira, recortado al anillo del padding con dos máscaras
   y composite:exclude. El ángulo se registra con @property para que sea
   interpolable; sin eso un conic-gradient no se puede animar de forma fluida. */
@property --beam-angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}
@keyframes beam-spin { to { --beam-angle: 360deg; } }

.beam { position: relative; border-radius: var(--radius); padding: 1px; height: 100%; }
.beam::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  padding: 1.5px;
  background: conic-gradient(from var(--beam-angle),
    transparent 0deg,
    oklch(0.55 0.13 157 / 0) 0deg,
    oklch(0.58 0.13 170 / 0.7) 15deg,
    oklch(0.62 0.13 183 / 1) 30deg,
    oklch(0.6 0.13 190 / 0.7) 45deg,
    oklch(0.55 0.13 195 / 0) 60deg,
    transparent 96deg);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: beam-spin 9s linear infinite;
  pointer-events: none;
}
html.dark .beam::before {
  background: conic-gradient(from var(--beam-angle),
    transparent 0deg,
    oklch(0.8 0.12 157 / 0) 0deg,
    oklch(0.82 0.12 170 / 0.7) 15deg,
    oklch(0.85 0.12 183 / 1) 30deg,
    oklch(0.83 0.12 190 / 0.7) 45deg,
    oklch(0.8 0.12 195 / 0) 60deg,
    transparent 96deg);
}
.beam > .card { border-radius: calc(var(--radius) - 1px); }

/* ---------- Etapas ---------- */
.stages { position: relative; display: grid; gap: 1.25rem; }
@media (min-width: 880px) {
  .stages { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stages::before {
    content: ""; position: absolute; top: 1rem; left: 0; right: 0;
    height: 1px; background: var(--border);
  }
}
.stage { position: relative; }
.stage-dot {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  width: 2rem; height: 2rem; border-radius: 50%;
  border: 2px solid var(--border); background: var(--card);
  color: var(--muted-fg); font-size: 0.75rem; font-weight: 700;
}
.stage-dot svg { width: 1rem; height: 1rem; }
.stage.done .stage-dot {
  border-color: var(--primary); background: var(--primary); color: var(--primary-fg);
}
.stage.current .stage-dot {
  border-color: var(--accent); background: var(--accent); color: var(--accent-fg);
  box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 25%, transparent);
}
.stage h3 { margin-top: 1rem; font-size: 0.9375rem; font-weight: 600; }
.stage-badge {
  margin-top: 0.25rem; color: var(--accent); font-size: 0.625rem;
  font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
}
.stage p.body { margin-top: 0.5rem; color: var(--muted-fg); font-size: 0.8125rem; }

/* ---------- Sabores ---------- */
.flavor {
  position: relative; overflow: hidden; height: 100%;
  display: flex; flex-direction: column;
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: box-shadow 0.3s;
}
.flavor:hover { box-shadow: var(--shadow-md); }
.flavor-wash {
  position: absolute; inset: 0; pointer-events: none;
  opacity: 0.16; transition: opacity 0.5s;
}
.flavor:hover .flavor-wash { opacity: 0.3; }

/* Zona de imagen. aspect-ratio reserva el espacio antes de que cargue la
   foto, así el texto no salta al aparecer. */
.can-stage {
  position: relative; aspect-ratio: 4 / 5; width: 100%;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
/* Ilustración de respaldo: se ve mientras no haya foto real. */
.can-art { width: auto; height: 82%; max-width: 70%; display: block; }
/* Foto del producto. Cuando carga, oculta la ilustración. */
.can-photo {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; object-position: center;
  /* padding dentro de la caja para que la lata no toque los bordes */
  padding: 0.75rem;
}
.can-stage.has-photo .can-art { display: none; }

.flavor-info { position: relative; padding: 0 1.25rem 1.25rem; }
.flavor h3 { font-size: 0.9375rem; font-weight: 600; }
.flavor .note { margin-top: 0.375rem; color: var(--muted-fg); font-size: 0.78rem; line-height: 1.4; }
.flavor .badge-award { margin: 0 0 0.5rem; }
.badge-award {
  display: inline-flex; align-items: center; gap: 0.25rem; width: fit-content;
  margin-bottom: auto; padding: 0.125rem 0.5rem; border-radius: 999px;
  border: 1px solid color-mix(in oklch, var(--accent) 40%, transparent);
  background: color-mix(in oklch, var(--accent) 10%, transparent);
  color: var(--accent); font-size: 0.625rem; font-weight: 600;
}
.badge-award svg { width: 0.75rem; height: 0.75rem; }
/* La nota se muestra siempre. Antes se revelaba al hacer hover, pero dejaba
   las tarjetas visualmente vacías y el contenido fuera de alcance en táctil y
   teclado. Mostrarla es más legible y más accesible. */

/* ---------- Hallazgos y bloques ---------- */
.finding-tag {
  display: flex; align-items: center; gap: 0.5rem;
  font-size: 0.625rem; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase;
}
.finding-tag svg { width: 1rem; height: 1rem; flex-shrink: 0; }
.card.pos { border-color: color-mix(in oklch, var(--primary) 30%, transparent); }
.card.pos .finding-tag { color: var(--primary); }
.card.caveat { border-color: color-mix(in oklch, var(--destructive) 30%, transparent); }
.card.caveat .finding-tag { color: var(--destructive); }
.card .finding-title { margin-top: 0.75rem; font-size: 0.9375rem; font-weight: 600; line-height: 1.35; }

.divider { margin-top: 3.5rem; padding-top: 2.5rem; border-top: 1px solid var(--border); }
.divider h3 { font-size: 1.125rem; font-weight: 600; }
.divider > p { margin-top: 0.5rem; max-width: 42rem; color: var(--muted-fg); font-size: 0.875rem; }

.block-row { display: flex; align-items: flex-start; gap: 0.75rem; }
.block-row > svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; margin-top: 0.125rem; color: var(--accent); }
.block-members { margin-top: 0.125rem; color: var(--accent); font-size: 0.75rem; font-weight: 500; }

/* ---------- Matriz ---------- */
.matrix-layout { display: grid; gap: 2.5rem; align-items: start; }
@media (min-width: 1000px) {
  .matrix-layout { grid-template-columns: minmax(0, 19rem) minmax(0, 1fr); }
  .matrix-controls { position: sticky; top: 5.25rem; }
}
.weights-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; }
.weights-head h3 { font-size: 0.875rem; font-weight: 600; }
.weights-head p { margin-top: 0.25rem; color: var(--muted-fg); font-size: 0.75rem; line-height: 1.45; }
.reset-btn {
  flex-shrink: 0; border: 0; background: none; padding: 0.375rem;
  border-radius: 0.25rem; color: var(--muted-fg); transition: color 0.2s;
}
.reset-btn:hover:not(:disabled) { color: var(--foreground); }
.reset-btn:disabled { opacity: 0.3; cursor: default; }
.reset-btn svg { width: 1rem; height: 1rem; display: block; }

.weight { margin-top: 1rem; }
.weight label {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 0.5rem; font-size: 0.75rem; font-weight: 500;
}
.weight .val { color: var(--accent); font-size: 0.6875rem; font-variant-numeric: tabular-nums; }
.weight input[type="range"] { width: 100%; margin: 0.5rem 0 0; accent-color: var(--primary); }
.weight .desc { margin-top: 0.25rem; color: var(--muted-fg); font-size: 0.6875rem; line-height: 1.4; }

.method {
  margin-top: 1rem; padding: 1rem; border-radius: var(--radius);
  border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
  background: color-mix(in oklch, var(--accent) 5%, transparent);
}
.method h4 { font-size: 0.75rem; font-weight: 600; }
.method p { margin-top: 0.375rem; color: var(--muted-fg); font-size: 0.6875rem; line-height: 1.5; }

.ranking { display: flex; flex-direction: column; gap: 0.75rem; }
.mkt {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  /* La transición de `order` no existe; el reordenamiento se suaviza con
     una animación de entrada al recolocar (ver .mkt.moved). */
  transition: border-color 0.3s;
}
.mkt.top { border-color: color-mix(in oklch, var(--accent) 50%, transparent); }
@keyframes settle {
  from { transform: translateY(-6px); opacity: 0.6; }
  to { transform: translateY(0); opacity: 1; }
}
.mkt.moved { animation: settle 0.4s cubic-bezier(0.22, 1, 0.36, 1); }

.mkt-btn {

  /* Icono inline. aria-hidden porque siempre acompaña a texto visible.
     La clase "ico" va siempre: garantiza un tamaño base aunque el icono se
     use en un contexto sin regla propia. */
  function ic(name, cls) {
    return '<svg class="ico' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2" stroke-linecap="round" ' +
      'stroke-linejoin="round" aria-hidden="true" focusable="false">' +
      (ICON[name] || "") + "</svg>";
  }

  /* Marca gráfica: colibrí estilizado. La prensa identifica a Pinda como "la
     bebida artesanal del colibrí", así que el símbolo es el ancla visual.
     Geometría simple en lugar de ilustración: escala bien a 20 px. */
  function mark(cls) {
    return '<svg class="brand-mark' + (cls ? " " + cls : "") + '" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">' +
      '<path d="M16.5 13.5C13 9.5 8.5 7.5 3.5 8.5c3 1 5.5 3 7 5.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
      '<path d="M16.8 12.4c3.2 0 5.6 2.3 5.6 5.4 0 3.4-2.8 6.6-6.6 8.9-.6.4-1.3-.2-1-.9.9-2 1.2-3.6 1-4.9-.3-2-1.8-2.9-3.3-4-1.3-1-1.9-2.2-1.6-3.3.3-1.1 1.6-1.2 2.5-1.2h3.4Z" fill="currentColor"/>' +
      '<path d="M22.1 15.6 29 12.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>' +
      '<circle cx="19.4" cy="16.4" r="1.5" fill="var(--accent)"/></svg>';
  }

  /**
   * Ilustración de lata, dibujada con geometría simple en el tono del sabor.
   *
   * Es el respaldo: se muestra mientras no exista la foto real en /images.
   * Así la tarjeta nunca se ve vacía ni con un icono de imagen rota, y al
   * añadir las fotos desaparece sola sin tocar el código.
   */
  function canArt(hue, idx) {
    var gid = "can" + idx;
    return '<svg class="can-art" viewBox="0 0 120 200" aria-hidden="true" focusable="false">' +
      "<defs>" +
      '<linearGradient id="' + gid + '" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0%" stop-color="oklch(0.52 0.14 ' + hue + ')"/>' +
      '<stop offset="34%" stop-color="oklch(0.74 0.16 ' + hue + ')"/>' +
      '<stop offset="68%" stop-color="oklch(0.6 0.15 ' + hue + ')"/>' +
      '<stop offset="100%" stop-color="oklch(0.44 0.12 ' + hue + ')"/>' +
      "</linearGradient>" +
      '<linearGradient id="' + gid + 'lid" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0%" stop-color="#9aa0a6"/>' +
      '<stop offset="45%" stop-color="#e8eaed"/>' +
      '<stop offset="100%" stop-color="#8b9196"/>' +
      "</linearGradient>" +
      "</defs>" +
      // Sombra de apoyo.
      '<ellipse cx="60" cy="186" rx="30" ry="5" fill="currentColor" opacity="0.1"/>' +
      // Estrechamiento hacia la tapa: es lo que hace que se lea como lata.
      '<path d="M26 48 L38 30 H82 L94 48 Z" fill="url(#' + gid + 'lid)"/>' +
      '<ellipse cx="60" cy="30" rx="22" ry="6" fill="url(#' + gid + 'lid)"/>' +
      '<ellipse cx="60" cy="30" rx="15" ry="4" fill="none" stroke="#7b8085" stroke-width="1"/>' +
      // Cuerpo.
      '<rect x="26" y="47" width="68" height="124" fill="url(#' + gid + ')"/>' +
      '<ellipse cx="60" cy="171" rx="34" ry="9" fill="oklch(0.4 0.11 ' + hue + ')"/>' +
      // Brillo metálico.
      '<rect x="36" y="47" width="7" height="124" fill="#fff" opacity="0.22"/>' +
      '<rect x="78" y="47" width="4" height="124" fill="#000" opacity="0.1"/>' +
      // Banda de etiqueta con el colibrí.
      '<rect x="26" y="92" width="68" height="36" fill="#fff" opacity="0.9"/>' +
      '<g transform="translate(44 100) scale(0.75)" fill="oklch(0.35 0.08 157)">' +
      '<path d="M16.8 12.4c3.2 0 5.6 2.3 5.6 5.4 0 3.4-2.8 6.6-6.6 8.9-.6.4-1.3-.2-1-.9.9-2 1.2-3.6 1-4.9-.3-2-1.8-2.9-3.3-4-1.3-1-1.9-2.2-1.6-3.3.3-1.1 1.6-1.2 2.5-1.2h3.4Z"/>' +
      '<path d="M22.1 15.6 29 12.2" stroke="oklch(0.35 0.08 157)" stroke-width="1.8" stroke-linecap="round"/>' +
      "</g>" +
      // Aro superior e inferior del cuerpo.
      '<ellipse cx="60" cy="47" rx="34" ry="8" fill="oklch(0.66 0.14 ' + hue + ')"/>' +
      "</svg>";
  }

  /* Referencia de fuente. Dos formas deliberadas: enlace cuando hay fuente,
     y aviso visible cuando el dato está pendiente de verificar. Que el
     segundo caso se vea distinto es intencional. */
  function ref(id) {
    var t = COPY[state.lang];
    if (id === "verificar") {
      return '<span class="ref-pending">' + ic("triangleAlert") +
        esc(t.ui.verifyPending) + "</span>";
    }
    var s = SOURCES[id];
    if (!s) return "";
    var title = t.ui.sourceLabel + ": " + s.label + " — " + s.note[state.lang];
    return '<a class="ref" href="' + esc(s.url) + '" target="_blank" ' +
      'rel="noreferrer noopener" title="' + esc(title) + '">' +
      ic("external") + '<span class="sr-only">' + esc(t.ui.viewSource) + ': </span>' +
      esc(s.label.split(" — ")[0]) + "</a>";
  }

  function sec(id, eyebrow, title, subtitle, body, tinted) {
    return '<section class="sec' + (tinted ? " tinted" : "") + '" id="' + id + '">' +
      '<div class="wrap"><div class="sec-head reveal">' +
      '<p class="sec-eyebrow">' + esc(eyebrow) + "</p>" +
      '<h2 class="sec-title grad">' + esc(title) + "</h2>" +
      (subtitle ? '<p class="sec-sub">' + esc(subtitle) + "</p>" : "") +
      '</div><div class="sec-body">' + body + "</div></div></section>";
  }

  /* ---------- estado ---------- */

  var state = {
    lang: "es",
    weights: {},
    open: MARKETS[0].id,
    prevOrder: []
  };

  function defaultWeights() {
    var w = {};
    CRITERIA.forEach(function (c) { w[c.id] = c.defaultWeight; });
    return w;
  }
  state.weights = defaultWeights();

  /* Puntaje ponderado normalizado a 100. El máximo posible es 5 * pesoTotal. */
  function score(market) {
    var total = 0, sum = 0;
    CRITERIA.forEach(function (c) {
      var w = state.weights[c.id] || 0;
      total += w;
      sum += market.scores[c.id].value * w;
    });
    return total === 0 ? 0 : (sum / (total * 5)) * 100;
  }

  function ranked() {
    return MARKETS.map(function (m) { return { m: m, s: score(m) }; })
      .sort(function (a, b) { return b.s - a.s; });
  }

  /* ---------- secciones ---------- */

  function renderNav() {
    var t = COPY[state.lang];
    var items = [
      ["propuesta", "thesis"], ["producto", "product"], ["entorno", "environment"],
      ["mercados", "markets"], ["entrada", "entry"], ["estrategia", "mix"],
      ["distribuidores", "contact"], ["fuentes", "sources"]
    ];
    document.getElementById("nav").innerHTML = "<ul>" + items.map(function (p) {
      return '<li><a href="#' + p[0] + '">' + esc(t.nav[p[1]]) + "</a></li>";
    }).join("") + "</ul>";
  }

  function heroHTML() {
    var t = COPY[state.lang];
    return '<section class="hero"><div class="hero-bg">' +
      '<div class="blob blob-1"></div><div class="blob blob-2"></div>' +
      '<div class="blob blob-3"></div><div class="hero-fade"></div></div>' +
      '<div class="wrap hero-inner">' +
      '<p class="eyebrow">' + ic("mapPin") + esc(t.hero.eyebrow) + "</p>" +
      '<h1 class="hero-title grad">' + esc(t.hero.title) + "</h1>" +
      '<p class="hero-lead">' + esc(t.hero.lead) + "</p>" +
      '<div class="hero-cta">' +
      '<a class="btn btn-primary" href="#mercados">' + esc(t.hero.ctaPrimary) + ic("arrowRight") + "</a>" +
      '<a class="btn btn-outline" href="#distribuidores">' + esc(t.hero.ctaSecondary) + "</a>" +
      "</div>" +
      '<div class="proof">' +
      '<div class="proof-item">' + ic("award") +
      "<p><b>" + esc(t.hero.awards) + '</b><span style="color:var(--muted-fg)">' + esc(t.hero.awardsTail) + "</span></p>" +
      ref("emprendePremios") + "</div>" +
      '<div class="proof-item">' + mark("pi-logo") +
      "<p><b>" + esc(t.hero.origin) + '</b><span style="color:var(--muted-fg)">' + esc(t.hero.originTail) + "</span></p>" +
      ref("pindaSobre") + "</div>" +
      "</div>" +
      '<p class="hero-note">' + esc(t.hero.note) + "</p>" +
      "</div></section>";
  }

  function thesisHTML() {
    var t = COPY[state.lang];
    var icons = ["mapPinned", "award", "truck"];
    var srcs = ["pindaSobre", "emprendePremios", "pindaDistribuidores"];
    var cards = t.thesis.pillars.map(function (p, i) {
      var inner = ic(icons[i], "lead-icon") +
        "<h3>" + esc(p.title) + "</h3>" +
        '<p class="body">' + esc(p.body) + "</p>" +
        '<p style="margin-top:0.75rem">' + ref(srcs[i]) + "</p>";
      // El primer pilar es la ventaja central del caso: lleva el haz de marca.
      return i === 0
        ? '<div class="reveal"><div class="beam"><div class="card">' + inner + "</div></div></div>"
        : '<div class="reveal"><div class="card">' + inner + "</div></div>";
    }).join("");
    return sec("propuesta", t.thesis.eyebrow, t.thesis.title, t.thesis.body,
      '<div class="grid g-3">' + cards + "</div>", false);
  }

  function stagesHTML() {
    var t = COPY[state.lang];
    /* Pinda recibe visibilidad internacional por sus premios pero no
       selecciona mercados ni contrata distribuidores fuera: exportación pasiva. */
    var CURRENT = 1;
    var items = t.stages.items.map(function (s, i) {
      var cls = i < CURRENT ? "done" : (i === CURRENT ? "current" : "");
      return '<li class="stage ' + cls + ' reveal">' +
        '<span class="stage-dot">' + (i < CURRENT ? ic("check") : String(i + 1)) + "</span>" +
        "<h3>" + esc(s.title) + "</h3>" +
        (i === CURRENT ? '<p class="stage-badge">' + esc(t.stages.current) + "</p>" : "") +
        '<p class="body">' + esc(s.body) + "</p></li>";
    }).join("");
    return sec("etapas", t.stages.eyebrow, t.stages.title, t.stages.subtitle,
      '<ol class="stages">' + items + "</ol>", true);
  }

  function productHTML() {
    var t = COPY[state.lang];
    var flavors = t.product.flavors.map(function (f, i) {
      var art = FLAVOR_ART[i] || { file: "sabor-" + (i + 1), hue: 150 };
      var wash = "radial-gradient(130% 90% at 80% 0%, oklch(0.72 0.16 " + art.hue + ") 0%, transparent 65%)";
      var alt = t.product.canAlt.replace("{flavor}", f.name);
      // Sin tabindex: la tarjeta no es interactiva y todo su texto está
      // visible, así que una parada de tabulación sólo estorbaría.
      return '<div class="reveal"><div class="flavor">' +
        '<div class="flavor-wash" style="background:' + wash + '"></div>' +
        '<div class="can-stage">' +
        canArt(art.hue, i) +
        // La foto va encima; al cargar oculta la ilustración. Si no existe,
        // pindaImgFallback prueba otras extensiones y luego se retira.
        '<img class="can-photo" src="images/' + art.file + '.jpg" alt="' + esc(alt) + '"' +
        ' loading="lazy" decoding="async"' +
        ' onload="this.parentNode.classList.add(\'has-photo\')"' +
        ' onerror="pindaImgFallback(this)">' +
        "</div>" +
        '<div class="flavor-info">' +
        (f.awarded
          ? '<span class="badge-award">' + ic("award") + esc(t.product.awardLabel) + "</span>"
          : "") +
        "<h3>" + esc(f.name) + "</h3>" +
        '<p class="note">' + esc(f.note) + "</p>" +
        "</div></div></div>";
    }).join("");

    var extra = '<div class="grid g-md-2" style="margin-top:2.5rem">' +
      '<div class="reveal"><div class="card flat">' +
      "<h3>" + ic("pkg", "lead-icon") + esc(t.product.formatsTitle) + "</h3>" +
      "<ul style=\"margin-top:0.75rem;display:flex;flex-direction:column;gap:0.375rem\">" +
      t.product.formats.map(function (f) {
        return '<li style="color:var(--muted-fg);font-size:0.8125rem">· ' + esc(f) + "</li>";
      }).join("") + "</ul>" +
      '<p style="margin-top:0.75rem">' + ref("pindaHome") + "</p></div></div>" +
      '<div class="reveal"><div class="card flat">' +
      "<h3>" + esc(t.product.positioningTitle) + "</h3>" +
      '<p class="body">' + esc(t.product.positioningBody) + "</p>" +
      '<p style="margin-top:0.75rem">' + ref("emprendePerfil") + "</p></div></div></div>";

    // Referente competitivo: sin él, la diferenciación que el plan defiende
    // no tendría contra qué contrastarse.
    var competitor = '<div class="reveal"><div class="card" style="margin-top:1.25rem;border-color:color-mix(in oklch, var(--accent) 30%, transparent)">' +
      "<h3>" + esc(t.product.competitorTitle) + "</h3>" +
      '<p class="body">' + esc(t.product.competitorBody) + "</p>" +
      '<p style="margin-top:0.75rem">' + ref(t.product.competitorSource) + "</p></div></div>";

    return sec("producto", t.product.eyebrow, t.product.title, t.product.subtitle,
      '<div class="grid g-4">' + flavors + "</div>" + extra + competitor, false);
  }

  function environmentHTML() {
    var t = COPY[state.lang];
    var findings = t.environment.findings.map(function (f, i) {
      // El segundo hallazgo es la contracara del primero: tono de advertencia
      // para que no se lea como otra buena noticia.
      var caveat = i === 1;
      return '<div class="reveal"><div class="card ' + (caveat ? "caveat" : "pos") + '">' +
        '<p class="finding-tag">' + ic(caveat ? "triangleAlert" : "gavel") +
        esc(t.environment.findingLabel) + " " + (i + 1) + "</p>" +
        '<h3 class="finding-title">' + esc(f.title) + "</h3>" +
        '<p class="body">' + esc(f.body) + "</p>" +
        '<p style="margin-top:0.75rem;display:flex;flex-wrap:wrap;gap:0.75rem">' +
        ref(f.source) + (f.source2 ? ref(f.source2) : "") + "</p></div></div>";
    }).join("");

    var blocks = t.environment.blocks.map(function (b) {
      return '<div class="card flat"><div class="block-row">' + ic("handshake") +
        "<div><h3>" + esc(b.name) + "</h3>" +
        '<p class="block-members">' + esc(b.members) + "</p>" +
        '<p class="body">' + esc(b.body) + "</p>" +
        '<p style="margin-top:0.625rem">' + ref(b.source) + "</p></div></div></div>";
    }).join("");

    var body = '<div class="grid g-lg-2">' + findings + "</div>" +
      '<div class="divider reveal"><h3>' + esc(t.environment.tariffTitle) + "</h3>" +
      "<p>" + esc(t.environment.tariffBody) + "</p>" +
      '<div class="grid g-md-2" style="margin-top:1.5rem">' + blocks + "</div>" +
      '<p style="margin-top:1rem;font-size:0.8125rem;color:var(--muted-fg)">' +
      esc(t.environment.apStat) + " " + ref(t.environment.apStatSource) + "</p></div>";

    return sec("entorno", t.environment.eyebrow, t.environment.title,
      t.environment.subtitle, body, false);
  }

  function matrixHTML() {
    var t = COPY[state.lang];
    var controls = '<div class="matrix-controls reveal">' +
      '<div class="card"><div class="weights-head"><div>' +
      "<h3>" + esc(t.matrix.weightsTitle) + "</h3>" +
      "<p>" + esc(t.matrix.weightsHint) + "</p></div>" +

      '<div id="weightList"></div></div>' +
      '<div class="method"><h4>' + esc(t.matrix.methodTitle) + "</h4>" +
      "<p>" + esc(t.matrix.methodBody) + "</p>" +
      '<p style="margin-top:0.5rem">' + ref("mercadoDisputado") + "</p></div></div>";

    return sec("mercados", t.matrix.eyebrow, t.matrix.title, t.matrix.subtitle,
      '<div class="matrix-layout">' + controls +
      '<div class="ranking" id="ranking"></div></div>', true);

  function renderWeights() {
    var t = COPY[state.lang];
    document.getElementById("weightList").innerHTML = CRITERIA.map(function (c) {
      return '<div class="weight"><label for="w-' + c.id + '">' +
        "<span>" + esc(c.label[state.lang]) + "</span>" +
        '<span class="val">' + state.weights[c.id] + "</span></label>" +
        '<input id="w-' + c.id + '" type="range" min="0" max="40" step="5" value="' +
        state.weights[c.id] + '" data-crit="' + c.id + '" aria-describedby="wd-' + c.id + '">' +
        '<p class="desc" id="wd-' + c.id + '">' + esc(c.description[state.lang]) + "</p></div>";
    }).join("");

    var isDefault = CRITERIA.every(function (c) {
      return state.weights[c.id] === c.defaultWeight;
    });
    document.getElementById("resetW").disabled = isDefault;
  }

  function renderRanking() {
    var t = COPY[state.lang];
    var list = ranked();
    var order = list.map(function (r) { return r.m.id; });

    document.getElementById("ranking").innerHTML = list.map(function (r, i) {
      var m = r.m, open = state.open === m.id;
      // `moved`: el puesto cambió respecto al render anterior. Dispara una
      // animación de recolocación para que el efecto de mover un peso se lea.
      var prev = state.prevOrder.indexOf(m.id);
      var moved = prev !== -1 && prev !== i;

      var why = CRITERIA.map(function (c) {
        var s = m.scores[c.id];
        var dots = "";
        for (var n = 1; n <= 5; n++) dots += '<i class="' + (n <= s.value ? "on" : "") + '"></i>';
        return "<li>" +
          '<span class="dots" role="img" aria-label="' + s.value + " / 5\">" + dots + "</span>" +
          "<span><b>" + esc(c.label[state.lang]) + ":</b> " +
          '<span style="color:var(--muted-fg)">' + esc(s.rationale[state.lang]) + "</span>" +
          (s.source ? " " + ref(s.source) : "") + "</span></li>";
      }).join("");

      return '<div class="mkt' + (i === 0 ? " top" : "") + (moved ? " moved" : "") + '">' +
        "<h3>" +
        '<button type="button" class="mkt-btn" data-mkt="' + m.id + '" ' +
        'aria-expanded="' + open + '" aria-controls="panel-' + m.id + '">' +
        '<span class="rank" aria-label="' + esc(t.matrix.rank) + " " + (i + 1) + '">' + (i + 1) + "</span>" +
        '<span class="flag" aria-hidden="true">' + m.flag + "</span>" +
        '<span class="mkt-name"><b>' + esc(m.name[state.lang]) + "</b>" +
        "<span>" + esc(m.agreement.value[state.lang]) + "</span></span>" +
        '<span class="bar" aria-hidden="true"><i style="width:' + r.s.toFixed(1) + '%"></i></span>' +
        '<span class="score"><b>' + r.s.toFixed(0) + "</b><span>/100</span></span>" +
        ic("chevronDown", "chev") + "</button></h3>" +
        '<div class="mkt-panel' + (open ? " open" : "") + '" id="panel-' + m.id + '"><div>' +
        '<div class="mkt-panel-inner">' +
        '<dl class="facts">' +
        "<div><dt>" + esc(t.matrix.population) + "</dt><dd>" +
        esc(m.population.value[state.lang]) + " " + ref(m.population.source) + "</dd></div>" +
        "<div><dt>" + esc(t.matrix.tariff) + "</dt><dd>" +
        esc(m.tariff.value[state.lang]) + " " + ref(m.tariff.source) + "</dd></div>" +
        '<div class="wide"><dt>' + esc(t.matrix.regulatoryLabel) + "</dt><dd>" +
        esc(m.regulatory.value[state.lang]) + " " + ref(m.regulatory.source) + "</dd></div>" +
        "</dl>" +
        '<div style="margin-top:1.25rem"><p class="sub-h">' + esc(t.matrix.logisticsLabel) + "</p>" +
        '<p style="margin-top:0.25rem;font-size:0.8125rem">' + esc(m.logistics[state.lang]) + "</p></div>" +
        '<div style="margin-top:1.25rem"><p class="sub-h">' + esc(t.matrix.whyLabel) + "</p>" +
        '<ul class="why">' + why + "</ul></div>" +
        "</div></div></div></div>";
    }).join("");

    state.prevOrder = order;
  }

  function entryHTML() {
    var t = COPY[state.lang];
    var cards = t.entry.modes.map(function (mo) {
      var inner =
        (mo.recommended ? '<p class="rec-tag">' + ic("star") + esc(t.entry.recommended) + "</p>" : "") +
        "<h3>" + esc(mo.name) + "</h3>" +
        '<p class="body">' + esc(mo.body) + "</p>" +
        '<div class="args pro"><p>' + esc(t.entry.prosLabel) + "</p><ul>" +
        mo.pros.map(function (x) { return "<li>" + ic("check") + "<span>" + esc(x) + "</span></li>"; }).join("") +
        "</ul></div>" +
        '<div class="args con"><p>' + esc(t.entry.consLabel) + "</p><ul>" +
        mo.cons.map(function (x) { return "<li>" + ic("x") + "<span>" + esc(x) + "</span></li>"; }).join("") +
        "</ul></div>";
      return mo.recommended
        ? '<div class="reveal"><div class="beam"><div class="card">' + inner + "</div></div></div>"
        : '<div class="reveal"><div class="card">' + inner + "</div></div>";
    }).join("");

    var phases = t.entry.sequence.map(function (s, i) {
      return '<li class="phase"><span class="phase-tag">' + esc(s.phase) + "</span>" +
        "<p>" + esc(s.body) + "</p>" +
        (i < t.entry.sequence.length - 1 ? '<span class="arrow" aria-hidden="true">→</span>' : "") +
        "</li>";
    }).join("");

    var body = '<div class="grid g-3">' + cards + "</div>" +
      '<div class="divider reveal"><h3>' + esc(t.entry.sequenceTitle) + "</h3>" +
      '<ol class="phases">' + phases + "</ol>" +
      '<p style="margin-top:1.25rem;font-size:0.8125rem;color:var(--muted-fg)">' +
      esc(t.entry.processNote) + " " + ref(t.entry.processNoteSource) + "</p></div>";

    return sec("entrada", t.entry.eyebrow, t.entry.title, t.entry.subtitle, body, false);
  }

  function mixHTML() {
    var t = COPY[state.lang];
    var rows = t.mix.items.map(function (it) {
      return '<div class="reveal"><article class="mix-row">' +
        "<h3>" + esc(it.p) + "</h3>" +
        '<div class="mix-col"><p>' + ic("lock") + esc(t.mix.standardize) + "</p>" +
        "<p>" + esc(it.standardize) + "</p></div>" +
        '<div class="mix-col adapt"><p>' + ic("globe") + esc(t.mix.adapt) + "</p>" +
        "<p>" + esc(it.adapt) + "</p></div></article></div>";
    }).join("");

    var body = '<div style="display:flex;flex-direction:column;gap:1rem">' + rows + "</div>" +
      '<div class="country-brand reveal"><h3>' + esc(t.mix.countryBrandTitle) + "</h3>" +
      "<p>" + esc(t.mix.countryBrandBody) + "</p></div>";

    return sec("estrategia", t.mix.eyebrow, t.mix.title, t.mix.subtitle, body, true);
  }

  function contactHTML() {
    var t = COPY[state.lang];
    var countries = MARKETS.map(function (m) {
      return '<option value="' + m.id + '">' + esc(m.name[state.lang]) + "</option>";
    }).join("");
    var chips = t.contact.channelOptions.map(function (o, i) {
      return '<label class="chip"><input type="radio" name="channel" value="' + esc(o) + '"' +
        (i === 0 ? " checked" : "") + ">" + esc(o) + "</label>";
    }).join("");

    var body = '<div class="form-layout">' +
      '<div class="reveal"><form class="dist" id="distForm" novalidate>' +
      '<div class="fields">' +
      '<div class="field"><label for="f-company">' + esc(t.contact.company) + "</label>" +
      '<input id="f-company" name="company" required placeholder="' + esc(t.contact.companyPh) + '"></div>' +
      '<div class="field"><label for="f-name">' + esc(t.contact.name) + "</label>" +
      '<input id="f-name" name="name" required placeholder="' + esc(t.contact.namePh) + '"></div>' +
      '<div class="field"><label for="f-email">' + esc(t.contact.email) + "</label>" +
      '<input id="f-email" name="email" type="email" required placeholder="' + esc(t.contact.emailPh) + '"></div>' +
      '<div class="field"><label for="f-country">' + esc(t.contact.country) + "</label>" +
      '<select id="f-country" name="country">' + countries + "</select></div>" +
      "</div>" +
      "<fieldset><legend>" + esc(t.contact.channel) + "</legend>" +
      '<div class="chips">' + chips + "</div></fieldset>" +
      '<div class="field"><label for="f-msg">' + esc(t.contact.message) + "</label>" +
      '<textarea id="f-msg" name="message" rows="4" placeholder="' + esc(t.contact.messagePh) + '"></textarea></div>' +
      '<div class="form-foot">' +
      '<button type="submit" class="btn btn-primary btn-sm">' + ic("send") + esc(t.contact.submit) + "</button>" +
      '<p class="form-status" id="formStatus" role="status" aria-live="polite"></p>' +
      "</div></form></div>" +
      '<div class="reveal"><aside class="notice">' +
      "<h3>" + ic("info") + esc(t.contact.noticeTitle) + "</h3>" +
      "<p>" + esc(t.contact.demoNotice) + "</p></aside></div></div>";

    return sec("distribuidores", t.contact.eyebrow, t.contact.title, t.contact.subtitle, body, true);
  }

  function sourcesHTML() {
    var t = COPY[state.lang];
    var tiers = ["institucional", "prensa", "empresa", "noFiable"];
    var groups = tiers.map(function (tier) {
      var items = Object.keys(SOURCES).filter(function (k) { return SOURCES[k].tier === tier; });
      if (!items.length) return "";
      return '<div class="tier-group reveal"><div class="tier-head">' +
        '<h3 class="tier-badge tier-' + tier + '">' + esc(t.sources.tiers[tier]) + "</h3>" +
        "<p>" + esc(t.sources.tierHelp[tier]) + "</p></div>" +
        '<ul class="src-list">' + items.map(function (k) {
          var s = SOURCES[k];
          return "<li>" +
            '<a href="' + esc(s.url) + '" target="_blank" rel="noreferrer noopener">' +
            esc(s.label) + ic("external") + "</a>" +
            "<p>" + esc(s.note[state.lang]) + "</p></li>";
        }).join("") + "</ul></div>";
    }).join("");

    var pending = '<div class="pending reveal">' +
      "<h3>" + ic("circleAlert") + esc(t.sources.pendingTitle) + "</h3>" +
      "<p>" + esc(t.sources.pendingBody) + "</p>" +
      "<ul>" + t.sources.pending.map(function (p) { return "<li>" + esc(p) + "</li>"; }).join("") +
      "</ul></div>";

    return sec("fuentes", t.sources.eyebrow, t.sources.title, t.sources.subtitle,
      groups + pending, false);
  }

  function renderFooter() {
    var t = COPY[state.lang];
    document.getElementById("footer").innerHTML = '<div class="foot-inner">' +
      '<div class="foot-brand">' + mark("") + "<b>" + esc(t.brand) + "</b>" +
      "<span>· " + esc(t.tagline) + "</span></div>" +
      "<p>" + esc(t.footer.academic) + "</p>" +
      "<p>" + esc(t.footer.disclaimer) + "</p>" +
      '<a class="ext" href="https://www.pindakombucha.cl/" target="_blank" rel="noreferrer noopener">' +
      esc(t.footer.originalSite) + ic("external") + "</a></div>";
  }

  /* ---------- render completo ---------- */

  function render() {
    document.getElementById("logoMark").innerHTML = mark("");
    renderNav();
    document.getElementById("contenido").innerHTML =
      heroHTML() + thesisHTML() + stagesHTML() + productHTML() +
      environmentHTML() + matrixHTML() + entryHTML() + mixHTML() +
      contactHTML() + sourcesHTML();
    renderWeights();
    renderRanking();
    renderFooter();
    updateThemeBtn();
    observeReveals();
  }

  /* ---------- interacción ---------- */

  // Delegación en document: sobrevive a cada re-render sin reenganchar.
  document.addEventListener("click", function (e) {
    var mktBtn = e.target.closest && e.target.closest(".mkt-btn");
    if (mktBtn) {
      var id = mktBtn.getAttribute("data-mkt");
      state.open = state.open === id ? null : id;
      var panel = document.getElementById("panel-" + id);
      // Se alterna in situ para no perder la posición de scroll.
      document.querySelectorAll(".mkt-panel.open").forEach(function (p) {
        if (p !== panel) {
          p.classList.remove("open");
          var b = p.previousElementSibling.querySelector(".mkt-btn");
          if (b) b.setAttribute("aria-expanded", "false");
        }
      });
      if (panel) {
        var isOpen = state.open === id;
        panel.classList.toggle("open", isOpen);
        mktBtn.setAttribute("aria-expanded", String(isOpen));
      }
      return;
    }

    if (e.target.closest && e.target.closest("#resetW")) {
      state.weights = defaultWeights();
      renderWeights();
      renderRanking();
      return;
    }

    var langBtn = e.target.closest && e.target.closest("#langSeg button");
    if (langBtn) {
      setLang(langBtn.getAttribute("data-lang"));
      return;
    }

    if (e.target.closest && e.target.closest("#themeBtn")) toggleTheme();
  });

  document.addEventListener("input", function (e) {
    var crit = e.target.getAttribute && e.target.getAttribute("data-crit");
    if (!crit) return;
    state.weights[crit] = Number(e.target.value);
    // Sólo se repinta el número y el ranking: repintar toda la lista de
    // sliders perdería el foco del control que el usuario está arrastrando.
    var label = e.target.previousElementSibling;
    if (label) label.querySelector(".val").textContent = state.weights[crit];
    var isDefault = CRITERIA.every(function (c) {
      return state.weights[c.id] === c.defaultWeight;
    });
    document.getElementById("resetW").disabled = isDefault;
    renderRanking();
  });

  document.addEventListener("submit", function (e) {
    if (e.target.id !== "distForm") return;
    e.preventDefault();
    var t = COPY[state.lang];
    document.getElementById("formStatus").innerHTML =
      ic("circleCheck") + esc(t.contact.submitted);
  });

  /* ---------- idioma ---------- */

  function setLang(lang) {
    if (lang !== "es" && lang !== "en") return;
    state.lang = lang;
    // `lang` del documento debe seguir al idioma activo: lo usan los lectores
    // de pantalla para la pronunciación.
    document.documentElement.lang = lang;
    try { localStorage.setItem("pinda-lang", lang); } catch (err) {}
    document.querySelectorAll("#langSeg button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === lang));
    });
    document.getElementById("langSeg").setAttribute("aria-label", COPY[lang].ui.langLabel);
    render();
  }

  /* ---------- tema ---------- */

  function toggleTheme() {
    var dark = !document.documentElement.classList.contains("dark");
    document.documentElement.classList.toggle("dark", dark);
    try { localStorage.setItem("pinda-theme", dark ? "dark" : "light"); } catch (err) {}
    updateThemeBtn();
  }

  function updateThemeBtn() {
    var dark = document.documentElement.classList.contains("dark");
    var t = COPY[state.lang];
    var btn = document.getElementById("themeBtn");
    btn.innerHTML = ic(dark ? "sun" : "moon");
    btn.setAttribute("aria-label", dark ? t.ui.themeLight : t.ui.themeDark);
  }

  /* ---------- entrada en viewport ---------- */

  function observeReveals() {
    var nodes = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) {
      nodes.forEach(function (n) { n.classList.add("in"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add("in");
          io.unobserve(en.target);
        }
      });
    }, { rootMargin: "-40px" });
    nodes.forEach(function (n) { io.observe(n); });
  }

  /* ---------- cabecera al hacer scroll ---------- */

  var hdr = document.querySelector("header.site");
  function onScroll() { hdr.classList.toggle("scrolled", window.scrollY > 8); }
  window.addEventListener("scroll", onScroll, { passive: true });

  /* ---------- arranque ---------- */

  try {
    var sl = localStorage.getItem("pinda-lang");
    if (sl === "es" || sl === "en") state.lang = sl;
    var st = localStorage.getItem("pinda-theme");
    var dark = st ? st === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    if (dark) document.documentElement.classList.add("dark");
  } catch (err) {}

  document.documentElement.lang = state.lang;
  document.querySelectorAll("#langSeg button").forEach(function (b) {
    b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === state.lang));
  });

  render();
  onScroll();
})();
</script>
</body>
</html>
