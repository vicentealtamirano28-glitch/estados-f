<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz CCI</title><style>
body{font-family:"Segoe UI",Arial,sans-serif;background:#F4F6FA;margin:0;color:#222}
header{background:#1F3864;color:#fff;padding:18px 24px}header h1{margin:0;font-size:22px}
.wrap{max-width:860px;margin:20px auto;padding:0 16px}.card{background:#fff;border-radius:12px;box-shadow:0 1px 5px #0002;padding:20px;margin-bottom:16px}
.bloque{display:inline-block;background:#DDEBF7;color:#1F3864;border-radius:10px;padding:2px 10px;font-size:12px;font-weight:bold}
h2{font-size:18px;margin:10px 0 14px}button.op{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 14px;border:2px solid #C9D3E3;border-radius:9px;background:#fff;font-size:15px;cursor:pointer}
button.op:hover{border-color:#2E75B6}button.ok{border-color:#548235!important;background:#E2EFDA}button.bad{border-color:#C00000!important;background:#FCE4D6}
.exp{margin-top:10px;padding:10px 12px;border-left:5px solid #2E75B6;background:#F2F6FC;display:none}.bar{height:10px;background:#E5E9F0;border-radius:5px;overflow:hidden;margin-top:6px}
.bar div{height:100%;background:#2E75B6;width:0}.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{background:#1F3864;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}.btn.sec{background:#5B6770}
select{padding:8px;border-radius:8px;font-size:14px}table{border-collapse:collapse;width:100%}td,th{padding:6px 8px;border-bottom:1px solid #E5E9F0;text-align:left}
.big{font-size:40px;font-weight:bold;color:#1F3864}</style></head><body>
<header><h1>Quiz interactivo · Concurso Carteras de Inversión</h1><div>45 preguntas en 12 bloques · funciona sin internet</div></header>
<div class="wrap"><div class="card nav"><div>Bloque: <select id="sel"></select> <label><input type="checkbox" id="mez" checked> mezclar</label></div>
<button class="btn" onclick="start()">Comenzar</button></div><div id="app"></div></div>
<script>
const Q=[{"b": "Concurso", "q": "¿Quién organiza el Concurso Carteras de Inversión (CCI)?", "o": ["La CMF", "La Bolsa de Santiago", "El Banco Central", "Las AFP"], "a": 1, "e": "Lo organiza la Bolsa de Santiago, hoy parte del holding regional nuam."}, {"b": "Concurso", "q": "En ediciones anteriores, ¿con cuánto capital ficticio partía cada participante?", "o": ["$1.000.000", "$5.000.000", "$20.000.000", "$100.000.000"], "a": 2, "e": "Se informaba un capital ficticio de $20 millones."}, {"b": "Concurso", "q": "Con una comisión de 0,5% por lado, ¿cuánto debe subir una acción para empatar una compra y su venta?", "o": ["0,5%", "~1,005%", "2%", "0,25%"], "a": 1, "e": "(1 + 0,005) / (1 − 0,005) − 1 ≈ 1,005%."}, {"b": "Concurso", "q": "¿Por qué una cartera parecida al IPSA casi nunca gana el CCI?", "o": ["Porque está prohibido", "Porque su volatilidad es baja y los ganadores necesitan retornos extremos", "Porque paga más comisión", "Porque el IPSA siempre cae"], "a": 1, "e": "Con volatilidad baja, la probabilidad de lograr +30% en 8 semanas es casi cero."}, {"b": "Concurso", "q": "¿Qué es la \"marcha blanca\" del CCI?", "o": ["La premiación", "Una fase de ensayo que no cuenta para el ranking", "El último día del concurso", "Una regla de comisiones"], "a": 1, "e": "Sirve para probar la plataforma y la estrategia sin consecuencias."}, {"b": "Concurso", "q": "Rotar toda la cartera 10 veces con comisión de 0,5% por lado cuesta aproximadamente:", "o": ["1%", "5%", "9,5%", "20%"], "a": 2, "e": "1 − (0,995/1,005)^10 ≈ 9,5%."}, {"b": "Torneo", "q": "El pago de un torneo donde solo premian a los primeros se parece a:", "o": ["Un bono", "Una opción de compra sobre tu rentabilidad", "Un depósito a plazo", "Una venta corta"], "a": 1, "e": "Tiene piso y ganancia grande sobre un umbral; su valor sube con la volatilidad."}, {"b": "Torneo", "q": "Si vas primero en el ranking a mitad del concurso, lo más lógico es:", "o": ["Concentrar en una sola acción", "Reducir volatilidad y no alejarte mucho de quienes te persiguen", "Rotar todos los días", "Vender todo y quedarte en caja sin pensar"], "a": 1, "e": "Quien lidera gana si \"no pasa nada\"; reduce la varianza relativa."}, {"b": "Torneo", "q": "Si vas muy atrás, la estrategia más racional es:", "o": ["Mantener una cartera igual al IPSA", "Aceptar más riesgo y diferenciarte, idealmente con tiempo", "Esperar al último minuto", "No operar"], "a": 1, "e": "Necesitas resultados distintos a los del resto; mejor hacerlo temprano."}, {"b": "Torneo", "q": "Tras caer 50%, ¿cuánto debes subir para recuperar?", "o": ["50%", "75%", "100%", "150%"], "a": 2, "e": "1/(1 − 0,5) − 1 = 100%."}, {"b": "Mercado", "q": "El S&P IPSA tiene actualmente (desde 2019):", "o": ["10 acciones", "30 acciones", "40 acciones", "100 acciones"], "a": 1, "e": "Pasó de 40 a 30 acciones en 2019. Verifiquen la composición vigente."}, {"b": "Mercado", "q": "¿Dónde se publican los hechos esenciales de las empresas chilenas?", "o": ["En el Banco Central", "En la CMF", "En el SII", "En el INE"], "a": 1, "e": "La CMF es el regulador; ahí se publican hechos esenciales y estados financieros."}, {"b": "Mercado", "q": "En la fecha ex-dividendo el precio de la acción tiende a:", "o": ["Subir por el monto del dividendo", "Caer aproximadamente por el monto del dividendo", "No cambiar", "Duplicarse"], "a": 1, "e": "Desde esa fecha el comprador ya no recibe el dividendo."}, {"b": "Mercado", "q": "Una orden límite:", "o": ["Se ejecuta siempre al instante", "Se ejecuta solo a tu precio o uno mejor", "Solo sirve para vender", "No paga comisión"], "a": 1, "e": "Controla el precio pero puede no ejecutarse."}, {"b": "Macro", "q": "Si el precio del cobre sube fuertemente, típicamente:", "o": ["El peso chileno se deprecia", "El peso chileno tiende a apreciarse y mejora el sentimiento local", "Los bancos quiebran", "Nada cambia"], "a": 1, "e": "El cobre es la principal exportación chilena."}, {"b": "Macro", "q": "Un recorte sorpresivo de la TPM suele favorecer más a:", "o": ["Consumo, inmobiliario y utilities", "Exportadores de cobre exclusivamente", "Aerolíneas por el petróleo", "Ninguno"], "a": 0, "e": "Bajan las tasas de descuento y el costo del crédito."}, {"b": "Macro", "q": "Un dólar más caro (peso más débil) tiende a beneficiar a:", "o": ["Importadores", "Exportadores que venden en USD", "Retail con costos en USD", "Aerolíneas"], "a": 1, "e": "Sus ingresos en USD valen más en pesos."}, {"b": "Macro", "q": "El catalizador más importante que suele coincidir con el CCI (oct–dic) es:", "o": ["La Navidad", "La temporada de resultados del tercer trimestre", "El Mundial", "El cambio de hora"], "a": 1, "e": "Las empresas publican resultados a fines de octubre y en noviembre."}, {"b": "Riesgo", "q": "Una acción tiene volatilidad diaria de 1%. Su volatilidad anual aproximada es:", "o": ["2,5%", "10%", "15,9%", "25,2%"], "a": 2, "e": "1% × √252 ≈ 15,9%."}, {"b": "Riesgo", "q": "Curtosis en exceso positiva significa:", "o": ["Más eventos extremos que una normal", "Menos riesgo", "Retornos siempre positivos", "Distribución uniforme"], "a": 0, "e": "Colas gordas: días extremos más frecuentes."}, {"b": "Riesgo", "q": "El máximo drawdown mide:", "o": ["La volatilidad promedio", "La mayor caída desde un máximo previo", "El retorno anual", "La beta"], "a": 1, "e": "Es la peor pérdida desde un peak."}, {"b": "Carteras", "q": "Con correlación igual a +1 entre dos activos:", "o": ["La diversificación elimina todo el riesgo", "No hay beneficio de diversificación", "La cartera rinde cero", "El riesgo se duplica"], "a": 1, "e": "El riesgo es el promedio ponderado de las volatilidades."}, {"b": "Carteras", "q": "Al aumentar el número de acciones con pesos iguales, el riesgo de la cartera converge a:", "o": ["Cero", "El riesgo sistemático (√ρ·σ)", "El riesgo de la acción más riesgosa", "Infinito"], "a": 1, "e": "El componente idiosincrático desaparece; el sistemático no."}, {"b": "Carteras", "q": "60% en A (σ=30%) y 40% en B (σ=15%), ρ=0,2. La volatilidad de la cartera es aproximadamente:", "o": ["24%", "20,1%", "15%", "30%"], "a": 1, "e": "σp² = 0,0324 + 0,0036 + 0,00432 = 0,04032 → 20,1%."}, {"b": "Carteras", "q": "La frontera eficiente es:", "o": ["El conjunto de carteras con mayor retorno esperado para cada nivel de riesgo", "La lista de acciones del IPSA", "La recta del CAPM", "El límite de comisiones"], "a": 0, "e": "Markowitz (1952)."}, {"b": "Carteras", "q": "La cartera tangente es la que:", "o": ["Tiene mínima varianza", "Maximiza el ratio de Sharpe", "Tiene beta 0", "Tiene más acciones"], "a": 1, "e": "Es el punto donde la CML toca la frontera eficiente."}, {"b": "CAPM", "q": "Según el CAPM, el mercado paga una prima por:", "o": ["El riesgo total", "El riesgo sistemático (beta)", "El riesgo idiosincrático", "La liquidez"], "a": 1, "e": "El idiosincrático se diversifica, por eso no se paga."}, {"b": "CAPM", "q": "rf = 4,75%, prima de mercado = 5,33%, β = 1,3. El retorno exigido es:", "o": ["10,08%", "11,68%", "6,93%", "12,98%"], "a": 1, "e": "4,75% + 1,3 × 5,33% = 11,68%."}, {"b": "CAPM", "q": "Pesos 50/30/20 con betas 1,4 / 0,6 / 1,0. La beta de la cartera es:", "o": ["1,00", "1,08", "1,20", "0,93"], "a": 1, "e": "0,7 + 0,18 + 0,2 = 1,08."}, {"b": "CAPM", "q": "Un activo ubicado sobre la SML tiene:", "o": ["Alfa negativo", "Alfa positivo", "Beta cero", "Riesgo nulo"], "a": 1, "e": "Rinde más de lo que exige su beta: está \"barato\"."}, {"b": "Desempeño", "q": "El ratio de Treynor divide el exceso de retorno por:", "o": ["La volatilidad", "La beta", "El tracking error", "El drawdown"], "a": 1, "e": "Treynor = (Rp − rf)/βp."}, {"b": "Desempeño", "q": "Rp=18%, rf=5%, β=1,2, Rm=12%. El alfa de Jensen es:", "o": ["+2,6%", "+4,6%", "+13%", "−1,4%"], "a": 1, "e": "18% − (5% + 1,2 × 7%) = 4,6%."}, {"b": "Desempeño", "q": "Un tracking error alto respecto del IPSA indica:", "o": ["Que la cartera se parece mucho al índice", "Que la cartera se diferencia mucho del índice", "Que no hay riesgo", "Que la beta es 1"], "a": 1, "e": "En un torneo, diferenciarse es necesario para ganar."}, {"b": "Fundamental", "q": "P/VL es el inverso de:", "o": ["El ROE", "El BME (book-to-market) de su tesina", "La beta", "El dividend yield"], "a": 1, "e": "BME = patrimonio contable / valor de mercado."}, {"b": "Fundamental", "q": "Para analizar un banco NO conviene usar:", "o": ["P/U", "P/VL", "ROE", "EV/EBITDA"], "a": 3, "e": "En bancos la deuda es materia prima; el EBITDA no tiene sentido."}, {"b": "Fundamental", "q": "El PEAD (post-earnings announcement drift) dice que tras una sorpresa positiva de utilidades:", "o": ["El precio vuelve al nivel previo de inmediato", "El precio tiende a seguir subiendo por semanas", "Siempre hay una caída", "No hay efecto"], "a": 1, "e": "Ball y Brown (1968); Bernard y Thomas (1989)."}, {"b": "Fundamental", "q": "Precio 6.800, UPA 410. El P/U es aproximadamente:", "o": ["6,0x", "16,6x", "1,7x", "41x"], "a": 1, "e": "6.800 / 410 = 16,6."}, {"b": "Técnico", "q": "Un RSI de 75 se interpreta típicamente como:", "o": ["Sobreventa", "Sobrecompra", "Neutral", "Error de cálculo"], "a": 1, "e": "> 70 sobrecompra; < 30 sobreventa."}, {"b": "Técnico", "q": "El \"cruce dorado\" ocurre cuando:", "o": ["La SMA50 cruza sobre la SMA200", "El precio cae bajo la SMA20", "El RSI baja de 30", "El volumen se duplica"], "a": 0, "e": "Se lee como señal alcista de mediano plazo."}, {"b": "Técnico", "q": "Según Jegadeesh y Titman (1993), las acciones ganadoras de los últimos 3–12 meses:", "o": ["Tienden a seguir ganando en los meses siguientes", "Siempre se revierten", "No muestran patrón", "Pierden el 50%"], "a": 0, "e": "Es el efecto momentum."}, {"b": "Conducta", "q": "Vender rápido las acciones ganadoras y mantener las perdedoras es:", "o": ["Sobreconfianza", "Efecto disposición", "Anclaje", "Momentum"], "a": 1, "e": "Shefrin y Statman (1985)."}, {"b": "Conducta", "q": "Comprar una acción solo porque \"todos hablan de ella\" tras subir mucho es:", "o": ["Diversificación", "Efecto manada / FOMO", "Análisis fundamental", "Cobertura"], "a": 1, "e": "El checklist antes de operar ayuda a evitarlo."}, {"b": "Estrategia", "q": "Capital $20 MM, riesgo aceptado 1% por idea, stop a 8%. El tamaño de la posición es:", "o": ["$200.000", "$1.600.000", "$2.500.000", "$8.000.000"], "a": 2, "e": "200.000 / 0,08 = 2.500.000 (12,5%)."}, {"b": "Estrategia", "q": "En una estructura core–satélite, los satélites son:", "o": ["La caja", "Apuestas de alta convicción con catalizador", "Bonos", "Las acciones de menor beta siempre"], "a": 1, "e": "El núcleo da estabilidad; los satélites, la opción de destacar."}, {"b": "Estrategia", "q": "Regla práctica para decidir si una operación vale la pena:", "o": ["Operar todos los días", "Que el movimiento esperado sea al menos ~3 veces el costo", "Comprar lo que más cayó", "Seguir la intuición"], "a": 1, "e": "Con ~1% de costo ida y vuelta, se exige ≥ 3% esperado."}];let set=[],i=0,score=0,log=[];
const blocks=["Todos",...new Set(Q.map(x=>x.b))];const sel=document.getElementById('sel');
blocks.forEach(b=>{const o=document.createElement('option');o.textContent=b;sel.appendChild(o)});
function shuffle(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function start(){const b=sel.value;set=Q.filter(x=>b==="Todos"||x.b===b).map(x=>({...x}));if(document.getElementById('mez').checked)shuffle(set);i=0;score=0;log=[];show()}
function show(){const app=document.getElementById('app');if(i>=set.length)return end();const q=set[i];
let h=`<div class="card"><span class="bloque">${q.b}</span> <span style="float:right">${i+1} / ${set.length} · aciertos: ${score}</span>
<div class="bar"><div style="width:${100*i/set.length}%"></div></div><h2>${q.q}</h2>`;
q.o.forEach((o,k)=>h+=`<button class="op" id="o${k}" onclick="ans(${k})">${String.fromCharCode(65+k)}) ${o}</button>`);
h+=`<div class="exp" id="exp"></div><div class="nav" style="margin-top:12px"><span></span><button class="btn" id="nx" style="display:none" onclick="i++;show()">Siguiente</button></div></div>`;app.innerHTML=h}
function ans(k){const q=set[i];if(document.getElementById('o0').disabled)return;q.o.forEach((_,j)=>{const b=document.getElementById('o'+j);b.disabled=true;if(j===q.a)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
const ok=k===q.a;if(ok)score++;log.push({b:q.b,ok});const e=document.getElementById('exp');e.style.display='block';e.innerHTML=(ok?'<b style="color:#548235">¡Correcto!</b> ':'<b style="color:#C00000">Incorrecto.</b> ')+q.e;document.getElementById('nx').style.display='inline-block'}
function end(){const by={};log.forEach(r=>{by[r.b]=by[r.b]||[0,0];by[r.b][1]++;if(r.ok)by[r.b][0]++});const pct=Math.round(100*score/set.length);
let rows=Object.entries(by).map(([b,[a,n]])=>`<tr><td>${b}</td><td>${a} / ${n}</td><td>${Math.round(100*a/n)}%</td><td>${a/n<0.7?'Repasar en la guía':'Bien'}</td></tr>`).join('');
document.getElementById('app').innerHTML=`<div class="card"><div class="big">${pct}%</div><p>${score} de ${set.length} correctas. ${pct>=85?'Nivel experto: listos para competir.':pct>=70?'Buen nivel: repasen los bloques bajo 70%.':'Repasen la guía y vuelvan a intentarlo.'}</p>
<table><tr><th>Bloque</th><th>Aciertos</th><th>%</th><th></th></tr>${rows}</table><p><button class="btn" onclick="start()">Repetir</button></p></div>`}
</script></body></html>
